workflows:

  ios-app-store:
    name: iOS – App Store
    max_build_duration: 120
    integrations:
      app_store_connect: NolimitEvents
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ch.nolimitevents.app
      node: v22
      xcode: latest
    scripts:
      - name: Installer les dépendances
        script: npm install --legacy-peer-deps
      - name: Build React
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Résoudre packages SPM
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath ios/App/SourcePackages
      - name: Incrémenter le numéro de build
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Configurer le code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-google-play:
    name: Android – Google Play
    max_build_duration: 120
    environment:
      android_signing:
        - nolimitevents_keystore
      vars:
        PACKAGE_NAME: ch.nolimitevents.app
      node: v22
    scripts:
      - name: Installer les dépendances
        script: npm install --legacy-peer-deps
      - name: Build React
        script: npm run build
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Build AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
