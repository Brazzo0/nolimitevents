<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <meta property="og:title" content="Billetterie – No Limit Events"/>
  <meta property="og:description" content="Achète tes billets pour les prochaines soirées 🎉"/>
  <meta property="og:image" content="https://app.nolimitevents.ch/logo512.png"/>
  <title>Billetterie – No Limit Events</title>
  <script src="https://js.stripe.com/v3/"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes slideUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      background:#080C12;
      font-family:'Inter',-apple-system,sans-serif;
      color:#fff;min-height:100vh;
      overflow-x:hidden;
    }

    /* ── TOPBAR ── */
    .topbar{
      position:fixed;top:0;left:0;right:0;z-index:50;
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 20px;
      background:rgba(8,12,18,.85);
      backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(255,0,128,.15);
    }
    .topbar-logo{display:flex;align-items:center;gap:10px}
    .topbar-logo img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,0,128,.4)}
    .topbar-name{font-size:13px;font-weight:900;color:#fff;letter-spacing:.3px}
    .topbar-link{
      font-size:11px;font-weight:700;color:rgba(255,0,128,.8);
      text-decoration:none;letter-spacing:.5px;
      display:flex;align-items:center;gap:4px;
    }

    /* ── HERO ── */
    .hero{position:relative;width:100%;margin-top:64px}
    .hero-img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
    .hero-placeholder{width:100%;aspect-ratio:4/5;background:linear-gradient(135deg,#141A22,#1C2430);display:flex;align-items:center;justify-content:center;font-size:80px}
    .hero-overlay{
      position:absolute;bottom:0;left:0;right:0;
      background:linear-gradient(to top,rgba(8,12,18,1) 0%,rgba(8,12,18,.7) 40%,transparent 100%);
      padding:40px 20px 24px;
    }
    .hero-by{font-size:10px;font-weight:700;color:rgba(255,0,128,.8);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}
    .hero-title{
      font-size:28px;font-weight:900;color:#fff;line-height:1.15;
      letter-spacing:-.5px;margin-bottom:10px;
    }
    .hero-badges{display:flex;flex-wrap:wrap;gap:8px}
    .hero-badge{
      display:flex;align-items:center;gap:5px;
      background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
      border-radius:20px;padding:5px 12px;
      font-size:11px;font-weight:600;color:rgba(255,255,255,.75);
    }

    /* ── COUNTDOWN ── */
    .countdown-wrap{
      background:linear-gradient(135deg,rgba(255,0,128,.12),rgba(123,47,255,.08));
      border-top:1px solid rgba(255,0,128,.2);
      border-bottom:1px solid rgba(255,0,128,.2);
      padding:20px;display:flex;align-items:center;justify-content:center;gap:0;
    }
    .cd-block{flex:1;max-width:70px;text-align:center}
    .cd-val{
      font-size:32px;font-weight:900;color:#FF0080;line-height:1;
      font-variant-numeric:tabular-nums;
    }
    .cd-label{font-size:9px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:2px;text-transform:uppercase;margin-top:4px}
    .cd-sep{font-size:28px;font-weight:900;color:rgba(255,0,128,.4);padding:0 2px;margin-bottom:12px;animation:pulse 1s infinite}

    /* ── TABS ── */
    .tabs{
      display:flex;border-bottom:1px solid rgba(255,255,255,.07);
      position:sticky;top:64px;z-index:40;
      background:rgba(8,12,18,.95);backdrop-filter:blur(12px);
    }
    .tab{
      flex:1;padding:14px 8px;text-align:center;
      font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
      color:rgba(255,255,255,.4);cursor:pointer;
      border-bottom:2px solid transparent;transition:all .2s;
      -webkit-tap-highlight-color:transparent;
    }
    .tab.active{color:#FF0080;border-bottom-color:#FF0080}

    /* ── TAB CONTENT ── */
    .tab-content{padding:24px 20px 100px;animation:fadeUp .3s both}

    /* ── BILLETS ── */
    .section-title{
      font-size:20px;font-weight:900;color:#fff;margin-bottom:4px;letter-spacing:-.3px;
    }
    .section-sub{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:20px}

    .phase-card{
      background:#141A22;border-radius:18px;
      margin-bottom:12px;overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
      transition:border-color .2s;
    }
    .phase-card.active-phase{border-color:rgba(255,0,128,.4)}
    .phase-card.sold-phase{border-color:rgba(255,68,68,.25)}
    .phase-card.locked-phase{opacity:.65}

    .phase-card-inner{padding:18px 16px;display:flex;align-items:center;gap:14px}
    .phase-icon{
      width:44px;height:44px;border-radius:12px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:20px;
    }
    .phase-icon.active{background:linear-gradient(135deg,#FF0080,#FF3399)}
    .phase-icon.sold{background:rgba(255,68,68,.15)}
    .phase-icon.locked{background:rgba(255,255,255,.06)}

    .phase-info{flex:1;min-width:0}
    .phase-name{font-size:14px;font-weight:800;color:#fff;margin-bottom:2px}
    .phase-desc{font-size:11px;color:rgba(255,255,255,.4);margin-bottom:6px}
    .phase-price-row{display:flex;align-items:center;gap:8px}
    .phase-chf{font-size:20px;font-weight:900;color:#FF0080}
    .phase-chf.sold-price{color:#FF4444;font-size:14px}

    .phase-action{flex-shrink:0}
    .btn-add{
      padding:10px 18px;border-radius:12px;border:none;
      background:linear-gradient(135deg,#FF0080,#FF3399);
      color:#fff;font-size:12px;font-weight:900;letter-spacing:.5px;
      cursor:pointer;font-family:inherit;
      box-shadow:0 4px 16px rgba(255,0,128,.4);
      transition:transform .1s,opacity .15s;
      -webkit-tap-highlight-color:transparent;
    }
    .btn-add:active{transform:scale(.95)}
    .btn-locked{
      padding:10px 16px;border-radius:12px;
      background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
      color:rgba(255,255,255,.3);font-size:11px;font-weight:700;letter-spacing:.5px;
      font-family:inherit;
    }
    .btn-soldout{
      padding:10px 16px;border-radius:12px;
      background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.3);
      color:#FF4444;font-size:11px;font-weight:900;letter-spacing:.5px;
      font-family:inherit;
    }

    /* Secure + payment */
    .secure-row{
      display:flex;align-items:center;gap:8px;justify-content:center;
      margin-top:20px;margin-bottom:12px;
    }
    .secure-badge{
      display:flex;align-items:center;gap:6px;
      background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.2);
      border-radius:20px;padding:6px 14px;
      font-size:11px;font-weight:700;color:rgba(0,230,118,.8);
    }
    .payment-icons{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
    .pay-icon{
      background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
      border-radius:8px;padding:5px 12px;
      font-size:10px;font-weight:800;color:rgba(255,255,255,.5);letter-spacing:.5px;
    }

    /* ── LINEUP ── */
    .lineup-grid{display:flex;flex-direction:column;gap:10px}
    .lineup-item{
      display:flex;align-items:center;gap:14px;
      background:#141A22;border-radius:14px;padding:14px 16px;
      border:1px solid rgba(255,255,255,.07);
    }
    .lineup-num{
      width:32px;height:32px;border-radius:50%;flex-shrink:0;
      background:linear-gradient(135deg,#FF0080,#FF3399);
      display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:900;color:#fff;
    }
    .lineup-name{font-size:14px;font-weight:800;color:#fff}

    /* ── INFOS ── */
    .info-card{
      background:#141A22;border-radius:16px;padding:18px 16px;
      border:1px solid rgba(255,255,255,.07);margin-bottom:12px;
    }
    .info-icon{font-size:22px;margin-bottom:8px}
    .info-label{font-size:10px;font-weight:700;color:#FF0080;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
    .info-val{font-size:15px;font-weight:700;color:#fff}
    .info-sub{font-size:12px;color:rgba(255,255,255,.4);margin-top:2px}

    /* ── EMPTY / LOADER ── */
    .loader-full{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px}
    .spinner{width:40px;height:40px;border:3px solid rgba(255,0,128,.2);border-top-color:#FF0080;border-radius:50%;animation:spin .8s linear infinite}
    .empty-full{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:12px;text-align:center;padding:40px}

    /* ── OTHER EVENTS ── */
    .other-events{padding:0 20px 40px}
    .other-title{font-size:12px;font-weight:800;color:rgba(255,255,255,.3);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
    .other-card{
      display:flex;align-items:center;gap:12px;
      background:#141A22;border-radius:14px;padding:12px 14px;
      border:1px solid rgba(255,255,255,.07);margin-bottom:10px;cursor:pointer;
      transition:border-color .2s;-webkit-tap-highlight-color:transparent;
    }
    .other-card:active{border-color:rgba(255,0,128,.3)}
    .other-thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#1C2430}
    .other-info{flex:1}
    .other-name{font-size:13px;font-weight:800;color:#fff}
    .other-date{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px}
    .other-arrow{color:rgba(255,0,128,.6);font-size:18px;font-weight:300}

    /* ── MODAL ── */
    .modal-overlay{
      position:fixed;inset:0;z-index:200;
      background:rgba(0,0,0,.75);backdrop-filter:blur(6px);
      display:flex;align-items:flex-end;justify-content:center;
    }
    .modal-sheet{
      width:100%;max-width:480px;background:#0D1117;
      border-radius:24px 24px 0 0;
      border:1px solid rgba(255,0,128,.2);border-bottom:none;
      max-height:90vh;overflow-y:auto;
      padding-bottom:env(safe-area-inset-bottom,16px);
      animation:slideUp .3s cubic-bezier(.34,1.2,.64,1) both;
    }
    .modal-drag{width:36px;height:4px;background:rgba(255,255,255,.2);border-radius:99px;margin:12px auto 0}
    .modal-header{padding:16px 20px 0;display:flex;align-items:center;justify-content:space-between}
    .modal-title{font-size:17px;font-weight:900;color:#fff}
    .modal-close{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
    .modal-body{padding:20px}

    .field-label{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px;margin-top:16px}
    .field-input{width:100%;padding:14px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font-size:15px;font-family:inherit;outline:none;transition:border-color .2s}
    .field-input:focus{border-color:rgba(255,0,128,.5);background:rgba(255,0,128,.04)}
    .field-input::placeholder{color:rgba(255,255,255,.2)}

    .qty-row{display:flex;align-items:center;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:12px;overflow:hidden}
    .qty-btn{width:52px;height:48px;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
    .qty-btn:active{background:rgba(255,0,128,.15)}
    .qty-val{flex:1;text-align:center;font-size:18px;font-weight:900;color:#fff}
    .qty-sep{width:1px;height:28px;background:rgba(255,255,255,.1);flex-shrink:0}

    #payment-element{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:12px;padding:4px;transition:border-color .2s;min-height:54px}

    .total-row{display:flex;justify-content:space-between;align-items:center;margin:18px 0 16px;padding:14px 16px;background:rgba(255,0,128,.06);border:1px solid rgba(255,0,128,.2);border-radius:14px}
    .total-label{font-size:12px;color:rgba(255,255,255,.5);font-weight:600}
    .total-amount{font-size:22px;font-weight:900;color:#FF0080}

    .pay-btn{width:100%;padding:17px;border-radius:14px;background:linear-gradient(135deg,#FF0080,#FF3399);color:#fff;font-size:16px;font-weight:900;letter-spacing:.8px;border:none;cursor:pointer;font-family:inherit;box-shadow:0 6px 24px rgba(255,0,128,.4);transition:opacity .2s,transform .1s;-webkit-tap-highlight-color:transparent}
    .pay-btn:active{transform:scale(.98)}
    .pay-btn:disabled{opacity:.5;cursor:default;box-shadow:none}
    .err-msg{color:#FF4444;font-size:12px;font-weight:700;margin-top:10px;padding:10px 12px;background:rgba(255,68,68,.08);border:1px solid rgba(255,68,68,.2);border-radius:10px}

    /* ── SUCCESS ── */
    .success-wrap{text-align:center;padding:10px 0}
    .s-icon{font-size:60px;margin-bottom:16px}
    .s-title{font-size:22px;font-weight:900;color:#00E676;margin-bottom:6px}
    .s-sub{font-size:13px;color:rgba(255,255,255,.45);margin-bottom:24px;line-height:1.6}
    .ticket-box{background:#141A22;border:1px solid rgba(0,230,118,.25);border-radius:18px;padding:20px;margin-bottom:16px}
    .ticket-id-label{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:2px;margin-bottom:12px}
    .qr-wrap{background:#fff;border-radius:12px;padding:10px;display:inline-block;margin-bottom:12px}
    .qr-wrap img{display:block;width:160px;height:160px}
    .s-event-name{font-size:15px;font-weight:800;color:#fff;margin-top:4px}
    .s-meta{font-size:12px;color:rgba(255,255,255,.4);margin-top:4px}
    .done-btn{width:100%;padding:14px;border-radius:12px;background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.3);color:#00E676;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit}
  </style>
</head>

<!-- Purchase modal -->
<div class="modal-overlay" id="modal" style="display:none" onclick="handleOverlayClick(event)">

    <div id="step-form">

      </div>
      <div class="modal-body">

</div>

<script>
  const SB_URL = 'https://eypfrylitsaplkqpyxsh.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cGZyeWxpdHNhcGxrcXB5eHNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4Mzg3MTMsImV4cCI6MjA5MzQxNDcxM30.Mo5cYeMahhmNwwHQId4Jc26BVgCSGAGiWapRWIHOK8s';
  const STRIPE_KEY = 'pk_live_51TTVaDFUXKzLhWzmPzssbExHX18VMOToe84YxYDRBSJOte5YQVUAYyyPs4abetTYlnf3FUZCRyST5jC7ZfQGLdWp00MVOLOkKj';
  const API_BASE = 'https://app.nolimitevents.ch';

  const { createClient } = supabase;
  const sb = createClient(SB_URL, SB_KEY);
  const stripe = Stripe(STRIPE_KEY);
  let stripeElements = null, paymentElement = null;

  let events = [], currentEv = null, qty = 1, activeTab = 'billets';

  const MONTHS = {'JANV':0,'FÉV':1,'MARS':2,'AVRIL':3,'MAI':4,'JUIN':5,'JUIL':6,'AOÛT':7,'SEPT':8,'OCT':9,'NOV':10,'DÉC':11};
  function parseDate(s) {
    if (!s) return null;
    const p = s.split(' ');
    if (p.length >= 4) { const m = MONTHS[p[2]]; if (m !== undefined) return new Date(+p[3], m, +p[1]); }
    return null;
  }

  // ── COUNTDOWN ──
  let cdTimer = null;
  function startCountdown(dateStr, timeStr) {
    if (cdTimer) clearInterval(cdTimer);
    function tick() {
      const target = parseDate(dateStr);
      if (!target) return;
      if (timeStr) { const [h,m] = timeStr.split(':'); target.setHours(+h||0, +m||0, 0); }
      const diff = target - Date.now();
      if (diff <= 0) { ['cd-days','cd-hours','cd-mins','cd-secs'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = '00'; }); return; }
      const d = Math.floor(diff/86400000);
      const h = Math.floor((diff%86400000)/3600000);
      const m2 = Math.floor((diff%3600000)/60000);
      const s = Math.floor((diff%60000)/1000);
      const pad = n => String(n).padStart(2,'0');
      const el = id => document.getElementById(id);
      if (el('cd-days')) el('cd-days').textContent = pad(d);
      if (el('cd-hours')) el('cd-hours').textContent = pad(h);
      if (el('cd-mins')) el('cd-mins').textContent = pad(m2);
      if (el('cd-secs')) el('cd-secs').textContent = pad(s);
    }
    tick();
    cdTimer = setInterval(tick, 1000);
  }

  // ── LOAD ──
  async function loadEvents() {
    const { data } = await sb.from('events').select('*').eq('published', true).eq('ended', false).order('created_at', { ascending: true });
    const app = document.getElementById('app');
    if (!data || data.length === 0) {
      app.innerHTML = `<div class="empty-full"><div style="font-size:60px">🎉</div><div style="font-size:18px;font-weight:900;margin-bottom:8px">Aucune soirée</div><div style="font-size:13px;color:rgba(255,255,255,.35)">Reviens bientôt pour les prochaines soirées !</div></div>`;
      return;
    }
    events = data;
    renderEvent(data[0]);
  }

  function renderEvent(ev) {
    currentEv = ev;
    const lineup = Array.isArray(ev.lineup) ? ev.lineup : (ev.lineup ? ev.lineup.split(',').map(s=>s.trim()) : []);
    const others = events.filter(e => e.id !== ev.id);

    document.getElementById('app').innerHTML = `
      <!-- HERO -->
      <div class="hero">
        ${ev.poster
          ? `<img class="hero-img" src="${ev.poster}" alt="${ev.title}"/>`
          : `<div class="hero-placeholder">🎵</div>`}
        <div class="hero-overlay">
          <div class="hero-by">No Limit Events · Billetterie Officielle</div>
          <div class="hero-title">${ev.title}</div>
          <div class="hero-badges">
            <div class="hero-badge">📅 ${ev.date}</div>
            ${ev.time ? `<div class="hero-badge">🕐 ${ev.time}</div>` : ''}
            <div class="hero-badge">📍 ${ev.location}${ev.city ? ', ' + ev.city : ''}</div>
          </div>
        </div>
      </div>

      <!-- COUNTDOWN -->
      <div class="countdown-wrap">
        <div class="cd-block"><div class="cd-val" id="cd-days">--</div><div class="cd-label">Jours</div></div>
        <div class="cd-sep">:</div>
        <div class="cd-block"><div class="cd-val" id="cd-hours">--</div><div class="cd-label">Heures</div></div>
        <div class="cd-sep">:</div>
        <div class="cd-block"><div class="cd-val" id="cd-mins">--</div><div class="cd-label">Min</div></div>
        <div class="cd-sep">:</div>
        <div class="cd-block"><div class="cd-val" id="cd-secs">--</div><div class="cd-label">Sec</div></div>
      </div>

      <!-- TABS -->
      <div class="tabs">
        <div class="tab active" id="tab-btn-billets" onclick="switchTab('billets')">🎟️ Billets</div>
        ${lineup.length > 0 ? `<div class="tab" id="tab-btn-lineup" onclick="switchTab('lineup')">👥 Lineup</div>` : ''}
        <div class="tab" id="tab-btn-infos" onclick="switchTab('infos')">ℹ️ Infos</div>
      </div>

      <!-- TAB: BILLETS -->
      <div class="tab-content" id="tab-billets">
        <div class="section-title">Choisissez vos billets</div>
        <div class="section-sub">Réservation sécurisée · Paiement par carte</div>
        ${buildPhasesHTML(ev)}
        <div class="secure-row">
          <div class="secure-badge">🔒 Réservation sécurisée</div>
        </div>
        <div class="payment-icons">
          <div class="pay-icon">VISA</div>
          <div class="pay-icon">MASTERCARD</div>
          <div class="pay-icon">AMEX</div>
          <div class="pay-icon">STRIPE</div>
        </div>
      </div>

      <!-- TAB: LINEUP -->
      ${lineup.length > 0 ? `
      <div class="tab-content" id="tab-lineup" style="display:none">
        <div class="section-title">Lineup</div>
        <div class="section-sub" style="margin-bottom:20px">${lineup.length} artiste${lineup.length > 1 ? 's' : ''} au programme</div>
        <div class="lineup-grid">
          ${lineup.map((a, i) => `
            <div class="lineup-item">
              <div class="lineup-num">${i+1}</div>
              <div class="lineup-name">${a}</div>
            </div>
          `).join('')}
        </div>
      </div>` : ''}

      <!-- TAB: INFOS -->
      <div class="tab-content" id="tab-infos" style="display:none">
        <div class="section-title">Informations</div>
        <div class="section-sub" style="margin-bottom:20px">Tout ce que tu dois savoir</div>
        <div class="info-card">
          <div class="info-icon">📅</div>
          <div class="info-label">Date</div>
          <div class="info-val">${ev.date}</div>
          ${ev.time ? `<div class="info-sub">Ouverture des portes à ${ev.time}</div>` : ''}
        </div>
        <div class="info-card">
          <div class="info-icon">📍</div>
          <div class="info-label">Lieu</div>
          <div class="info-val">${ev.location}</div>
          ${ev.city ? `<div class="info-sub">${ev.city}</div>` : ''}
        </div>
        ${ev.category ? `<div class="info-card"><div class="info-icon">🎵</div><div class="info-label">Style</div><div class="info-val">${ev.category}</div></div>` : ''}
        <div class="info-card">
          <div class="info-icon">📱</div>
          <div class="info-label">Application</div>
          <div class="info-val">No Limit Events</div>
          <div class="info-sub">Télécharge l'app pour suivre tes billets</div>
        </div>
      </div>

      <!-- AUTRES SOIRÉES -->
      ${others.length > 0 ? `
      <div class="other-events">
        <div class="other-title">Autres soirées</div>
        ${others.map(e => `
          <div class="other-card" onclick="renderEvent(${JSON.stringify(e).replace(/"/g,'&quot;')})">
            ${e.poster ? `<img class="other-thumb" src="${e.poster}" alt=""/>` : `<div class="other-thumb" style="display:flex;align-items:center;justify-content:center;font-size:22px">🎵</div>`}
            <div class="other-info">
              <div class="other-name">${e.title}</div>
              <div class="other-date">${e.date}${e.time ? ' · ' + e.time : ''}</div>
            </div>
            <div class="other-arrow">›</div>
          </div>
        `).join('')}
      </div>` : ''}
    `;

    startCountdown(ev.date, ev.time);
    window.scrollTo({ top: 0, behavior: 'smooth' });
    activeTab = 'billets';
  }

  function buildPhasesHTML(ev) {
    const active = ev.active_phase || 1;
    const phases = [
      { n: 1, price: ev.phase1_price, cap: ev.phase1_capacity || 0, sold: ev.phase1_sold || 0, label: 'Early Bird', desc: 'Les premiers billets au meilleur prix' },
      { n: 2, price: ev.phase2_price, cap: ev.phase2_capacity || 0, sold: ev.phase2_sold || 0, label: 'Regular', desc: 'Disponible après la Phase 1' },
      { n: 3, price: ev.phase3_price, cap: ev.phase3_capacity || 0, sold: ev.phase3_sold || 0, label: 'Last Call', desc: 'Derniers billets disponibles' },
    ].filter(p => p.price > 0);

    if (phases.length === 0) {
      const isFull = ev.capacity > 0 && (ev.tickets_sold || 0) >= ev.capacity;
      return `
        <div class="phase-card ${isFull ? 'sold-phase' : 'active-phase'}">
          <div class="phase-card-inner">
            <div class="phase-icon ${isFull ? 'sold' : 'active'}">${isFull ? '🔴' : '🎟️'}</div>
            <div class="phase-info">
              <div class="phase-name">Billet soirée</div>
              <div class="phase-desc">${isFull ? 'Plus de places disponibles' : 'Places disponibles'}</div>
              <div class="phase-price-row"><div class="phase-chf ${isFull ? 'sold-price' : ''}">CHF ${ev.price || 0}</div></div>
            </div>
            <div class="phase-action">
              ${isFull
                ? `<div class="btn-soldout">SOLD OUT</div>`
                : `<button class="btn-add" onclick="openModal(null, 1)">ACHETER</button>`}
            </div>
          </div>
        </div>`;
    }

    return phases.map(p => {
      const isActive = p.n === active;
      const isPast = p.n < active;
      const isFull = isPast || (p.cap > 0 && p.sold >= p.cap);
      return `
        <div class="phase-card ${isActive ? 'active-phase' : isFull ? 'sold-phase' : 'locked-phase'}">
          <div class="phase-card-inner">
            <div class="phase-icon ${isActive ? 'active' : isFull ? 'sold' : 'locked'}">${isActive ? '🎟️' : isFull ? '🔴' : '🔒'}</div>
            <div class="phase-info">
              <div class="phase-name">Phase ${p.n} · ${p.label}</div>
              <div class="phase-desc">${isActive ? p.desc : isFull ? 'Épuisée' : p.desc}</div>
              <div class="phase-price-row">
                <div class="phase-chf ${isFull ? 'sold-price' : ''}">${isActive ? 'CHF ' + p.price : isFull ? 'SOLD OUT' : '—'}</div>
              </div>
            </div>
            <div class="phase-action">
              ${isActive
                ? `<button class="btn-add" onclick="openModal(${p.n}, ${p.price})">ACHETER</button>`
                : isFull
                  ? `<div class="btn-soldout">SOLD OUT</div>`
                  : `<div class="btn-locked">À VENIR</div>`}
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function switchTab(tab) {
    ['billets', 'lineup', 'infos'].forEach(t => {
      const btn = document.getElementById('tab-btn-' + t);
      const content = document.getElementById('tab-' + t);
      if (btn) btn.className = 'tab' + (t === tab ? ' active' : '');
      if (content) content.style.display = t === tab ? 'block' : 'none';
    });
    activeTab = tab;
  }

  // ── MODAL ──
  let selectedPhase = 1, selectedPrice = 0;

  function openModal(phase, price) {
    selectedPhase = phase;
    selectedPrice = price || currentEv.price || 0;
    qty = 1;

    document.getElementById('qty-display').textContent = '1';
    document.getElementById('field-name').value = '';
    document.getElementById('field-email').value = '';
    document.getElementById('pay-error').style.display = 'none';
    document.getElementById('step-form').style.display = 'block';
    document.getElementById('step-success').style.display = 'none';
    document.getElementById('pay-btn').disabled = false;

    const phaseLabel = phase ? `PHASE ${phase} · ${['EARLY BIRD','REGULAR','LAST CALL'][phase-1]||''}` : 'BILLET SOIRÉE';
    document.getElementById('modal-phase-label').textContent = phaseLabel;
    document.getElementById('modal-event-name').textContent = currentEv.title;
    document.getElementById('modal-title').textContent = 'CHF ' + selectedPrice;
    updateTotal();

    document.getElementById('modal').style.display = 'flex';
    setTimeout(() => mountPaymentElement(), 100);
  }

  function mountPaymentElement() {
    if (paymentElement) { paymentElement.unmount(); paymentElement = null; }
    const amountCents = Math.round(selectedPrice * qty * 100);
    stripeElements = stripe.elements({
      mode: 'payment',
      amount: amountCents,
      currency: 'chf',
      appearance: { theme: 'night', variables: { colorPrimary: '#FF0080', colorBackground: '#141A22', colorText: '#FFFFFF', colorDanger: '#FF4444', fontFamily: 'Inter,sans-serif', borderRadius: '12px' } }
    });
    paymentElement = stripeElements.create('payment', { layout: 'tabs' });
    document.getElementById('payment-element').innerHTML = '';
    paymentElement.mount('#payment-element');
  }

  function closeModal() {
    document.getElementById('modal').style.display = 'none';
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modal')) closeModal();
  }

  function changeQty(d) {
    qty = Math.max(1, Math.min(10, qty + d));
    document.getElementById('qty-display').textContent = qty;
    updateTotal();
    if (stripeElements) stripeElements.update({ amount: Math.round(selectedPrice * qty * 100) });
  }

  function updateTotal() {
    const total = selectedPrice * qty;
    document.getElementById('total-display').textContent = 'CHF ' + total.toFixed(2).replace('.00','');
    document.getElementById('pay-btn').textContent = 'PAYER CHF ' + total.toFixed(2).replace('.00','');
  }

  function showError(msg) {
    const el = document.getElementById('pay-error');
    el.className = 'err-msg'; el.textContent = msg; el.style.display = 'block';
  }

  async function handlePay() {
    if (!currentEv || !stripeElements) return;
    const name = document.getElementById('field-name').value.trim();
    const email = document.getElementById('field-email').value.trim();
    if (!name) { showError('⚠️ Entre ton prénom et nom.'); return; }
    if (!email || !email.includes('@')) { showError('⚠️ Entre un email valide.'); return; }

    const btn = document.getElementById('pay-btn');
    btn.disabled = true; btn.textContent = 'TRAITEMENT…';
    document.getElementById('pay-error').style.display = 'none';

    const amount = selectedPrice * qty;
    try {
      // Validate payment element fields
      const { error: submitErr } = await stripeElements.submit();
      if (submitErr) { showError('❌ ' + submitErr.message); btn.disabled = false; updateTotal(); return; }

      // Create payment intent
      const r = await fetch(`${API_BASE}/api/create-payment-intent`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount }) });
      const { clientSecret, error: apiErr } = await r.json();
      if (apiErr || !clientSecret) throw new Error(apiErr || 'Erreur serveur');

      // Save pending ticket for TWINT redirect
      const pendingData = { eventId: currentEv.id, event: currentEv.title, date: currentEv.date, time: currentEv.time, location: currentEv.location, buyerName: name, buyerEmail: email, qty, unitPrice: selectedPrice, selectedPhase };
      localStorage.setItem('nle_pending_ticket_web', JSON.stringify(pendingData));

      // Confirm payment (TWINT will redirect, Apple Pay / card won't)
      const { error: stripeErr } = await stripe.confirmPayment({
        elements: stripeElements,
        clientSecret,
        confirmParams: { return_url: window.location.href.split('?')[0] },
        redirect: 'if_required'
      });

      localStorage.removeItem('nle_pending_ticket_web');
      if (stripeErr) { showError('❌ ' + stripeErr.message); btn.disabled = false; updateTotal(); return; }

      // Immediate success (card / Apple Pay)
      await saveBilletterieTickets(name, email);

    } catch (err) {
      localStorage.removeItem('nle_pending_ticket_web');
      showError('❌ ' + (err.message || 'Erreur de paiement'));
      btn.disabled = false; updateTotal();
    }
  }

  async function saveBilletterieTickets(name, email) {
    const ticketIds = [];
    for (let i = 0; i < qty; i++) {
      await new Promise(r => setTimeout(r, 50));
      const id = 'NLE-' + Date.now().toString().slice(-6) + '-' + (i + 1);
      ticketIds.push(id);
      await sb.from('tickets').insert({ id, event_id: currentEv.id, event: currentEv.title, date: currentEv.date, location: currentEv.location, time: currentEv.time, owner: name, email, type: 'paid', price: selectedPrice, status: 'valid', source: 'web' });
    }

    const newSold = (currentEv.tickets_sold || 0) + qty;
    const phaseCol = selectedPhase ? `phase${selectedPhase}_sold` : null;
    const phaseUpdate = { tickets_sold: newSold };
    if (phaseCol) {
      const newPhaseSold = (currentEv[phaseCol.replace('_sold','')] || 0) + qty;
      phaseUpdate[phaseCol] = newPhaseSold;
      const capCol = phaseCol.replace('_sold','_capacity');
      const phaseCap = currentEv[capCol] || 0;
      if (phaseCap > 0 && newPhaseSold >= phaseCap && selectedPhase < 3) {
        const nextPhase = selectedPhase + 1;
        const nextPrice = currentEv[`phase${nextPhase}_price`];
        if (nextPrice) { phaseUpdate.active_phase = nextPhase; phaseUpdate.price = nextPrice; }
      }
    }
    await sb.from('events').update(phaseUpdate).eq('id', currentEv.id);

    for (const id of ticketIds) {
      try { await fetch(`${API_BASE}/api/send-ticket`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, name, eventTitle: currentEv.title, eventDate: currentEv.date, eventLocation: currentEv.location, ticketId: id }) }); } catch {}
    }

    document.getElementById('s-ticket-id').textContent = '# ' + ticketIds[0] + (qty > 1 ? ` + ${qty-1} autre${qty>1?'s':''}` : '');
    document.getElementById('s-qr').src = `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(ticketIds[0])}&size=160x160&bgcolor=141A22&color=FF0080&margin=8`;
    document.getElementById('s-event').textContent = currentEv.title;
    document.getElementById('s-meta').textContent = currentEv.date + ' · ' + currentEv.location;
    document.getElementById('step-form').style.display = 'none';
    document.getElementById('step-success').style.display = 'block';
  }

  // Handle TWINT redirect
  (async () => {
    const p = new URLSearchParams(window.location.search);
    const status = p.get('redirect_status');
    if (status === 'succeeded') {
      window.history.replaceState(null, '', window.location.pathname);
      const pending = JSON.parse(localStorage.getItem('nle_pending_ticket_web') || 'null');
      if (pending) {
        localStorage.removeItem('nle_pending_ticket_web');
        // Restore state so saveBilletterieTickets works
        currentEv = { id: pending.eventId, title: pending.event, date: pending.date, time: pending.time, location: pending.location, tickets_sold: 0 };
        selectedPhase = pending.selectedPhase;
        selectedPrice = pending.unitPrice;
        qty = pending.qty;
        await saveBilletterieTickets(pending.buyerName, pending.buyerEmail);
        // Fetch real event data to refresh UI
        const { data } = await sb.from('events').select('*').eq('id', pending.eventId).single();
        if (data) { events = [data]; renderEvent(data); }
        // Show success modal
        document.getElementById('modal').style.display = 'flex';
      }
    }
  })();

  loadEvents();
</script>
</body>
</html>
