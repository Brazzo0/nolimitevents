<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Nouveau mot de passe – No Limit Events</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

    @keyframes logoIn {
      0%  { transform: scale(0.3) rotate(-15deg); opacity: 0; filter: blur(20px); }
      60% { transform: scale(1.15) rotate(3deg);  opacity: 1; filter: blur(0); }
      80% { transform: scale(0.95) rotate(-1deg); }
      100%{ transform: scale(1) rotate(0deg);     opacity: 1; }
    }
    @keyframes glowPulse {
      0%,100%{ box-shadow: 0 0 30px rgba(255,0,128,.5), 0 0 60px rgba(255,0,128,.2); }
      50%    { box-shadow: 0 0 60px rgba(255,0,128,.9), 0 0 100px rgba(255,0,128,.4); }
    }
    @keyframes fadeUp {
      from{ opacity:0; transform:translateY(24px); }
      to  { opacity:1; transform:translateY(0); }
    }
    @keyframes shimmer {
      0%  { background-position: 200% center; }
      100%{ background-position: -200% center; }
    }
    @keyframes badgeIn {
      0%  { transform: scale(0); opacity:0; }
      60% { transform: scale(1.3); }
      100%{ transform: scale(1); opacity:1; }
    }
    @keyframes snakeMove {
      from{ stroke-dashoffset: 240; }
      to  { stroke-dashoffset: -2360; }
    }
    @keyframes btnPulse {
      0%,100%{ box-shadow: 0 8px 32px rgba(255,0,128,.4); }
      50%    { box-shadow: 0 8px 48px rgba(255,0,128,.7); }
    }

    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }

    body {
      min-height: 100vh;
      background: #080C12;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 32px 16px;
    }

    .bg-glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse at 50% -10%, rgba(255,0,128,.18) 0%, transparent 60%);
    }

    .snake-svg {
      position: fixed; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }

    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px;
      text-align: center;
    }

    .logo-wrap {
      width: 110px; height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,0,128,.25), rgba(123,47,255,.2));
      border: 2px solid rgba(255,0,128,.5);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      overflow: hidden;
      animation: logoIn .9s cubic-bezier(.34,1.56,.64,1) both, glowPulse 3s ease-in-out 1s infinite;
    }

    .logo-wrap img {
      width: 100%; height: 100%; object-fit: cover;
      filter: drop-shadow(0 0 16px rgba(255,0,128,.9));
    }

    .lock-badge {
      position: absolute; bottom: -4px; right: -4px;
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, #FF0080, #7B2FFF);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 14px rgba(255,0,128,.6);
      animation: badgeIn .5s .9s cubic-bezier(.34,1.56,.64,1) both;
    }

    .brand {
      font-size: 13px; font-weight: 700;
      color: rgba(255,255,255,.3);
      letter-spacing: 3px; text-transform: uppercase;
      margin-bottom: 10px;
      animation: fadeUp .5s .3s both;
    }

    .headline {
      font-size: 28px; font-weight: 900;
      line-height: 1.2; margin-bottom: 10px;
      background: linear-gradient(90deg, #FF0080, #FF99CC, #FF0080);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeUp .5s .4s both, shimmer 3s linear 1s infinite;
    }

    .sub {
      font-size: 14px; color: rgba(255,255,255,.45);
      line-height: 1.6; margin-bottom: 32px;
      animation: fadeUp .5s .5s both;
    }

    .box {
      background: linear-gradient(160deg, #141A22 0%, #0D1117 100%);
      border-radius: 24px;
      border: 1px solid rgba(255,0,128,.2);
      box-shadow: 0 24px 64px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04);
      padding: 28px 24px;
      animation: fadeUp .5s .6s both;
    }

    label {
      display: block;
      font-size: 10px; font-weight: 700; color: rgba(255,255,255,.35);
      letter-spacing: 1.5px; text-transform: uppercase;
      text-align: left; margin-bottom: 8px;
    }

    .input-wrap {
      position: relative; margin-bottom: 16px;
    }

    .input-wrap .icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 16px; pointer-events: none;
    }

    input[type="password"] {
      width: 100%; padding: 14px 16px 14px 42px;
      background: rgba(255,255,255,.05);
      border: 1.5px solid rgba(255,255,255,.1);
      border-radius: 14px;
      color: #fff; font-size: 15px;
      font-family: inherit; outline: none;
      transition: border-color .2s, background .2s;
    }

    input[type="password"]:focus {
      border-color: rgba(255,0,128,.6);
      background: rgba(255,0,128,.05);
    }

    input[type="password"]::placeholder { color: rgba(255,255,255,.2); }

    .btn {
      width: 100%; padding: 17px;
      border-radius: 14px;
      background: linear-gradient(135deg, #FF0080, #FF3399);
      color: #fff; font-size: 16px; font-weight: 900;
      letter-spacing: 1px; border: none; cursor: pointer;
      font-family: inherit;
      margin-top: 4px;
      animation: btnPulse 2.5s ease-in-out 1.5s infinite;
      transition: opacity .2s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .5; cursor: default; animation: none; }

    .msg {
      margin-top: 16px; padding: 14px 16px;
      border-radius: 14px; font-size: 13px; font-weight: 700;
      line-height: 1.5;
    }
    .msg.success { background: rgba(0,230,118,.1); border: 1px solid rgba(0,230,118,.3); color: #00E676; }
    .msg.error   { background: rgba(255,68,68,.1);  border: 1px solid rgba(255,68,68,.3);  color: #FF4444; }

    .strength-bar {
      height: 3px; border-radius: 99px;
      background: rgba(255,255,255,.08);
      margin: -10px 0 16px; overflow: hidden;
    }
    .strength-fill {
      height: 100%; border-radius: 99px;
      transition: width .3s, background .3s;
      width: 0%;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- Serpent néon -->
  <svg class="snake-svg" viewBox="0 0 400 850" preserveAspectRatio="none">
    <path d="M 30 -15 C 30 50,370 100,370 165 C 370 230,30 280,30 345 C 30 410,370 460,370 525 C 370 590,30 640,30 705 C 30 770,370 820,370 885 C 370 940,200 970,200 970"
      fill="none" stroke="#FF0080" stroke-width="2.5" stroke-dasharray="220 2500" stroke-linecap="round" opacity="0.8"
      style="animation:snakeMove 8.8s 0s linear infinite; filter:drop-shadow(0 0 6px #FF0080) drop-shadow(0 0 14px rgba(255,0,128,.5))"/>
    <path d="M 30 -15 C 30 50,370 100,370 165 C 370 230,30 280,30 345 C 30 410,370 460,370 525 C 370 590,30 640,30 705 C 30 770,370 820,370 885 C 370 940,200 970,200 970"
      fill="none" stroke="#FF0080" stroke-width="2.5" stroke-dasharray="220 2500" stroke-linecap="round" opacity="0.8"
      style="animation:snakeMove 8.8s 4.4s linear infinite; filter:drop-shadow(0 0 6px #FF0080)"/>
  </svg>

  <div class="card">

    <!-- Logo -->
    <div style="position:relative;display:inline-block;margin-bottom:24px;">
      <div class="logo-wrap">
        <img src="/logo_transparent.png" alt="No Limit Events"/>
      </div>
      <div class="lock-badge">🔑</div>
    </div>

    <div class="brand">No Limit Events</div>
    <div class="headline">Nouveau<br/>mot de passe 🔐</div>
    <div class="sub">Choisis un mot de passe sécurisé<br/>pour ton compte No Limit Events</div>

    <div class="box">

      <label>Nouveau mot de passe</label>
      <div class="input-wrap">
        <span class="icon">🔒</span>
        <input type="password" id="pass1" placeholder="Minimum 6 caractères" oninput="updateStrength()"/>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>

      <label>Confirmer le mot de passe</label>
      <div class="input-wrap">
        <span class="icon">🔒</span>
        <input type="password" id="pass2" placeholder="Répète ton mot de passe"/>
      </div>

      <button class="btn" id="btn" onclick="resetPassword()">ENREGISTRER 🚀</button>
      <div id="msg" style="display:none"></div>

    </div>

    <div style="text-align:center;margin-top:20px;animation:fadeUp .5s .9s both;opacity:0;">
      <p style="font-size:12px;color:rgba(255,255,255,.2);">Des questions ? <a href="mailto:info@nolimitevents.ch" style="color:rgba(255,0,128,.5);text-decoration:none;">info@nolimitevents.ch</a></p>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const { createClient } = supabase;
    const sb = createClient(
      'https://eypfrylitsaplkqpyxsh.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5cGZyeWxpdHNhcGxrcXB5eHNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4Mzg3MTMsImV4cCI6MjA5MzQxNDcxM30.Mo5cYeMahhmNwwHQId4Jc26BVgCSGAGiWapRWIHOK8s'
    );

    function updateStrength() {
      const val = document.getElementById('pass1').value;
      const fill = document.getElementById('strengthFill');
      let score = 0;
      if (val.length >= 6)  score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const pct = (score / 5) * 100;
      const color = score <= 1 ? '#FF4444' : score <= 3 ? '#FFD700' : '#00E676';
      fill.style.width = pct + '%';
      fill.style.background = color;
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + type;
      el.style.display = 'block';
    }

    async function resetPassword() {
      const pass1 = document.getElementById('pass1').value;
      const pass2 = document.getElementById('pass2').value;
      const btn   = document.getElementById('btn');

      if (!pass1 || pass1.length < 6) { showMsg('⚠️ Le mot de passe doit faire au moins 6 caractères.', 'error'); return; }
      if (pass1 !== pass2)             { showMsg('⚠️ Les mots de passe ne correspondent pas.', 'error'); return; }

      btn.disabled = true;
      btn.textContent = 'Enregistrement...';

      const { error } = await sb.auth.updateUser({ password: pass1 });

      if (error) {
        showMsg('❌ ' + error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'ENREGISTRER 🚀';
      } else {
        showMsg('✅ Mot de passe mis à jour ! Tu peux retourner dans l\'app.', 'success');
        btn.style.animation = 'none';
        btn.style.background = 'linear-gradient(135deg,#00E676,#00BCD4)';
        btn.textContent = 'RETOURNER DANS L\'APP 🚀';
        btn.disabled = false;
        btn.onclick = () => { window.location.href = 'https://apps.apple.com/ch/app/no-limit-events/id6768564892'; };
      }
    }
  </script>
</body>
</html>
